    - cron: '0 19 * * *'   # 19:00
    - cron: '15 19 * * *'  # 19:15
    - cron: '30 19 * * *'  # 19:30
    - cron: '45 19 * * *'  # 19:45
    - cron: '0 20 * * *'   # 20:00
