    - cron: '45 12 * * *'  # 12:45
    - cron: '0 13 * * *'   # 13:00
    - cron: '15 13 * * *'  # 13:15
    - cron: '30 13 * * *'  # 13:30
    - cron: '45 13 * * *'  # 13:45
    - cron: '0 14 * * *'   # 14:00
    - cron: '15 14 * * *'  # 14:15
    - cron: '30 14 * * *'  # 14:30
    - cron: '45 14 * * *'  # 14:45
    - cron: '0 15 * * *'   # 15:00
    - cron: '15 15 * * *'  # 15:15
    - cron: '30 15 * * *'  # 15:30
    - cron: '45 15 * * *'  # 15:45
    - cron: '0 16 * * *'   # 16:00
    - cron: '15 16 * * *'  # 16:15
    - cron: '30 16 * * *'  # 16:30
    - cron: '45 16 * * *'  # 16:45
